[package]
name = "proselytize"
version = "1.0.0"
description = "Proselytize Rust Engine by Manhã de Morango S/A (Schwartzian Transform, ZIP64 Central Directory & STORE Streamer)"
authors = ["StrawberryMorning <Manhã de Morango S/A>"]
edition = "2021"

[lib]
name = "misericordia_cbz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zopfli = "=0.8.1"
