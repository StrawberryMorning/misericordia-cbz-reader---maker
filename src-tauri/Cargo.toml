[package]
name = "misericordia_cbz_reader_and_maker"
version = "0.1.0"
description = "Misericordia CBZ Reader & Maker Rust Core Engine (Schwartzian Transform + ZIP Central Directory + STORE Level 0)"
authors = ["StrawberryMorning"]
edition = "2021"

[lib]
name = "misericordia_cbz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zopfli = "=0.8.1"
